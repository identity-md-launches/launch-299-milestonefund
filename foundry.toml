[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
ffi = false
fs_permissions = []

[lint]
# Day-scale windows are compared against block.timestamp by design; timestamps fit in uint64 until year 2^64.
exclude_lints = ["block-timestamp", "unsafe-typecast"]

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 48
fail_on_revert = false

[fmt]
line_length = 120
tab_width = 4
